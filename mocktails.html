<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bar 8 AM mocktail menu">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;">
    <title>Bar 8 AM - Mocktails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/jpeg" href="images/Bar_8_AM.jpg">
    <script src="script.js" defer></script>
</head>
<body data-page="menu" data-category="mocktails">
    <div class="page-container">
        <img src="images/Background.jpg" alt="" class="background-image" data-i18n-alt="images.background">
        <div class="background-overlay"></div>
        <div class="floating-controls">
            <button class="language-toggle" type="button" data-language-toggle data-i18n-label="language.label">
                <span data-i18n="language.toggle">EN</span>
            </button>
            <a href="index.html" class="logo-badge">
                <img src="images/Bar_8_AM.jpg" alt="" data-i18n-alt="images.logo">
            </a>
        </div>
        <div class="sticky-nav">
            <header class="page-header">
                <div class="header-content">
                    <a href="index.html" class="home-button" aria-label="Home" data-i18n-label="nav.home">
                        <span aria-hidden="true">⌂</span>
                    </a>
                    <div>
                        <p class="eyebrow" data-i18n="nav.mocktails">モクテル</p>
                        <h1 class="page-title" data-category-title>モクテル</h1>
                    </div>
                </div>
            </header>
            <nav class="nav-buttons compact" aria-label="Menu categories">
                <a href="cocktails.html" class="nav-button"><span data-i18n="nav.cocktails">カクテル</span></a>
                <a href="mocktails.html" class="nav-button active"><span data-i18n="nav.mocktails">モクテル</span></a>
                <a href="wines.html" class="nav-button"><span data-i18n="nav.wines">ワイン</span></a>
                <a href="beers.html" class="nav-button"><span data-i18n="nav.beers">ビール</span></a>
                <a href="about.html" class="nav-button"><span data-i18n="nav.about">店舗情報</span></a>
            </nav>
        </div>
        <main class="menu-page">
            <section class="menu-intro">
                <p data-category-subtitle>お酒が苦手な方や休肝日にも楽しめる、香り豊かなノンアルコールドリンク。</p>
            </section>
            <section class="menu-tools" aria-label="Menu search and filters">
                <label for="menu-search" id="menu-search-label" data-i18n="menu.searchLabel">メニュー検索</label>
                <input id="menu-search" type="search" data-menu-search data-i18n-placeholder="menu.searchPlaceholder" aria-labelledby="menu-search-label">
                <div class="filter-row" data-filters></div>
                <p class="menu-note" data-i18n="menu.taxNote">価格は目安です。正式な価格は店舗でご確認ください。</p>
            </section>
            <p class="empty-state" data-no-results hidden data-i18n="menu.noResults">条件に合うメニューがありません。</p>
            <section class="drinks-grid page-content" data-menu-grid></section>
        </main>
        <footer class="footer">
            <p data-i18n="footer.copyright">© 2026 Bar 8 AM. All rights reserved.</p>
            <p data-i18n="footer.note">大宮のバー / 日本語・英語メニュー対応</p>
        </footer>
    </div>
</body>
</html>
